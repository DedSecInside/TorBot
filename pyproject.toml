[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torbot"
version = "4.2.0"
authors = [
    { name="Akeem King", email="akeemtlking@gmail.com" },
    { name="PS Narayanan", email="thepsnarayanan@gmail.com" },
]
description = "TorBot is an OSINT tool for the dark web."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
]
dependencies = [
  "altgraph>=0.17.4",
  "beautifulsoup4>=4.12.3",
  "certifi>=2024.8.30",
  "charset-normalizer>=3.3.2",
  "decorator>=5.1.1",
  "idna>=3.7",
  "igraph>=0.11.6",
  "joblib>=1.3.2",
  "macholib>=1.16.3",
  "progress>=1.6",
  "pyinstaller>=6.8.0",
  "pyinstaller-hooks-contrib>=2024.8",
  "PySocks>=1.7.1",
  "python-dotenv>=1.0.1",
  "scikit-learn>=1.5.1",
  "scipy>=1.13.1",
  "six>=1.16.0",
  "soupsieve>=2.5",
  "termcolor>=2.4.0",
  "texttable>=1.7.0",
  "threadpoolctl>=3.5.0",
  "urllib3>=2.2.2",
  "validators>=0.33.0",
  "treelib>=1.7.0",
  "numpy>=1.26.4",
  "unipath>=1.1",
  "httpx[socks]>=0.28.1",
  "tabulate>=0.9.0",
  "phonenumbers>=8.13.45",
  "pytest>=8.3.2",
  "yattag>=1.15.1",
  "toml>=0.10.2",
  "lxml>=5.3.0",
]
